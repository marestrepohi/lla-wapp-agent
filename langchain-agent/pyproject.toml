[project]
name = "lla-langchain-agent"
version = "0.1.0"
description = "Local Groq and LangChain agent over the LLA SQLite mock"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.12,<5",
    "chainlit>=2,<3",
    "langchain>=1.0,<2",
    "langchain-chroma>=0.2,<2",
    "langchain-core>=1.0,<2",
    "langchain-groq>=0.3,<2",
    "langchain-huggingface>=0.1,<2",
    "langchain-qdrant>=0.2,<2",
    "langchain-text-splitters>=1,<2",
    "langgraph>=1,<2",
    "langgraph-checkpoint-sqlite>=2,<4",
    "python-dotenv>=1,<2",
    "requests>=2.32,<3",
    "sentence-transformers>=3.3.1,<6",
    "torch>=2.0",
    "lla-wapp-agent==0.1.0",
]

[project.optional-dependencies]
telegram = ["python-telegram-bot>=21,<23"]
webhook = ["fastapi>=0.115,<1", "groq>=0.13.1,<1", "httpx>=0.27,<1", "uvicorn[standard]>=0.30,<1"]
dev = ["pytest>=8,<9", "ruff>=0.8,<1"]

[tool.uv.sources]
lla-wapp-agent = { path = "..", editable = true }
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lla_langchain_agent"]
